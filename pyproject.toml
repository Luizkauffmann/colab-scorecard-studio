[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scorecard-studio"
version = "0.1.0"
description = "Optimal binning, WOE and scorecard engine for binary-target models (credit PD, fraud, AML, Kaggle), built for Google Colab."
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "Luiz Kauffmann" }]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "optbinning>=0.19",
    # Serves the binning app inside Colab (preinstalled there).
    "flask>=2.2",
    # Logistic regression with p-values and VIF (preinstalled in Colab).
    "statsmodels>=0.14",
]

[project.optional-dependencies]
dev = ["pytest>=7", "matplotlib>=3.7", "pyarrow>=12", "nbformat>=5", "nbclient>=0.7", "ipykernel>=6"]
# Preinstalled in Colab; needed for plots, Parquet outputs and the OpenML fallback.
notebook = ["matplotlib>=3.7", "pyarrow>=12", "scikit-learn>=1.2"]

[project.urls]
Homepage = "https://github.com/Luizkauffmann/colab-scorecard-studio"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# The default demo dataset ships with the package, so the template runs
# without a Kaggle account.
scorecard_studio = ["data/*.csv.gz", "app/static/*", "align/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    # optbinning imports cvxpy, which may warn about optional solvers it cannot load
    "ignore::UserWarning:cvxpy.*",
]
